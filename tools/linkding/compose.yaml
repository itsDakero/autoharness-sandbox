# linkding: self-hosted bookmark manager (tags, search, archive). Users and bookmarks live in its UI/database.
services:
  linkding:
    image: sissbruecker/linkding:1.41.0
    container_name: linkding
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9090/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: ${TZ}
    ports:
      - "8097:9090"
    volumes:
      - ${APPDATA_PATH}/linkding:/etc/linkding/data
    networks:
      - proxy
    labels:
      # Traefik (bonus http://linkding.lan)
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.linkding.rule=Host(`linkding.${DOMAIN}`)
      - traefik.http.routers.linkding.entrypoints=web
      - traefik.http.services.linkding.loadbalancer.server.port=9090
      # Dashboard
      - homelab.name=linkding
      - homelab.group=Tools
      - homelab.icon=linkding
      - homelab.audience=admin
      - homelab.description=Bookmarks with tags and search
      - homelab.port=8097
      # Uptime Kuma (AutoKuma)
      - kuma.linkding.http.name=linkding
      - kuma.linkding.http.url=http://${LAN_IP}:8097/health

networks:
  proxy:
    external: true
