services:
  radarr:
    image: linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "7878:7878"                  # host port = homelab.port
    volumes:
      - ${APPDATA_PATH}/radarr:/config
      # Read-write (approved via the guard): imports hardlink from /mnt/media/downloads/movies
      # into /mnt/media/movies; same path as in qbittorrent, one filesystem.
      - ${MEDIA_PATH}:/mnt/media
    networks:
      - proxy
    labels:
      # Traefik (bonus http://radarr.lan)
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=web
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      # Dashboard
      - homelab.name=Radarr
      - homelab.group=Media
      - homelab.icon=radarr
      - homelab.audience=admin
      - homelab.description=Movies, up to 2160p
      - homelab.port=7878
      # Uptime Kuma (AutoKuma) – checks the published port, like family devices use it
      - kuma.radarr.http.name=radarr
      - kuma.radarr.http.url=http://${LAN_IP}:7878/ping

networks:
  proxy:
    external: true
