services:
  traefik:
    image: traefik:v3.7.14
    container_name: traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: ${PUID}:${PGID}
    command:
      - --entrypoints.web.address=:80
      # Dashboard and Dozzle on their own entrypoints, both behind admin-auth; ping on 8090, not published, for Kuma
      - --entrypoints.traefik-ui.address=:8080
      - --entrypoints.dozzle.address=:8082
      - --entrypoints.ping.address=:8090
      - --api.dashboard=true
      - --ping=true
      - --ping.entrypoint=ping
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      TZ: ${TZ}
    ports:
      - "80:80"
      - "8080:8080"                  # host port = homelab.port
      - "8082:8082"                  # dozzle, behind admin-auth
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - socket-proxy
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=PathPrefix(`/`)
      - traefik.http.routers.traefik.entrypoints=traefik-ui
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=admin-auth@docker
      - traefik.http.middlewares.admin-auth.forwardauth.address=http://dashboard:8000/auth/verify
      # Dashboard
      - homelab.name=Traefik
      - homelab.group=Infrastructure
      - homelab.icon=traefik
      - homelab.audience=admin
      - homelab.description=Reverse proxy routes
      - homelab.port=8080
      # Uptime Kuma (AutoKuma)
      - kuma.traefik.http.name=traefik
      - kuma.traefik.http.url=http://traefik:8090/ping

networks:
  proxy:
    external: true
  socket-proxy:
    external: true
