<title>LeafGreen Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column; sticky area switcher on top, tab bar fixed at the bottom. Field-notebook greens, amber for hidden finds. */
:root{
  --bg:#EEF3EA; --surface:#FBFCF8; --sunk:#E3EADF; --ink:#1C2820; --muted:#566A5C; --line:#CBD8CC;
  --accent:#2C7A4B; --accent-ink:#FFFFFF; --hidden:#9A5B0C; --hidden-bg:#F7E9CF;
  --good:#1F7A3E; --bad:#B4372B; --warn:#9A5B0C;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-display:"Pixelify Sans", "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#18221C; --sunk:#0D1410; --ink:#E4EEE6; --muted:#9CB2A3; --line:#2C3B31;
  --accent:#6CC490; --accent-ink:#0D1A12; --hidden:#E6AE55; --hidden-bg:#33270F;
  --good:#6CC490; --bad:#F08A7E; --warn:#E6AE55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#18221C; --sunk:#0D1410; --ink:#E4EEE6; --muted:#9CB2A3; --line:#2C3B31;
  --accent:#6CC490; --accent-ink:#0D1A12; --hidden:#E6AE55; --hidden-bg:#33270F;
  --good:#6CC490; --bad:#F08A7E; --warn:#E6AE55; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;letter-spacing:.01em;word-spacing:.04em}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.top{padding-block:18px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;color:var(--accent)}
.save{font-size:.82rem;color:var(--muted);text-align:right}
.areabar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.areabar .row{display:flex;gap:8px;align-items:center}
.areabar select{flex:1;min-width:0;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}
.iconbtn:disabled{opacity:.4}
.progress{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meta{font-size:.85rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.areahead{padding-block:20px 6px}
.areahead h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.01em}
.areahead p{margin:4px 0 0;color:var(--muted)}
section.block{margin-top:22px}
.block>h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block>h3 span{text-transform:none;letter-spacing:0;font-size:.85rem}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.checks input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--accent)}
.checks .done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.txt{min-width:0}
.itemname{font-weight:700}
.where{display:block;color:var(--muted);font-size:.92rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.tag.hid{background:var(--hidden-bg);color:var(--hidden);border-color:transparent}
.tag.tm{color:var(--accent);border-color:var(--accent)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chipbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:grid;gap:10px}
.wild{display:grid;gap:4px}
.wildgroup{margin-top:10px}
.wildgroup:first-child{margin-top:0}
.wildgroup b{font-size:.85rem;color:var(--muted)}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .nm{font-weight:700;min-width:0;flex:1}
.wrow .lv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.addbtn{padding:5px 10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer;font-size:.85rem}
.type{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--t) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--t) 55%,var(--surface));color:var(--ink);white-space:nowrap}
.types{display:inline-flex;gap:4px;flex-wrap:wrap}
.bossbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer}
.bossbtn strong{font-size:1.05rem}
.btn{padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn.ghost{background:transparent}
.muted{color:var(--muted)}
.note{font-size:.92rem;color:var(--muted);margin:6px 0 0}
/* Team */
.mon{display:grid;gap:12px}
.monhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.monhead h3{font-size:1.25rem}
.lvl{display:flex;align-items:center;gap:6px}
.lvl input{width:58px;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.lvl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.15rem}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.moves select{width:100%;min-width:0;padding:9px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.advice{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:8px}
.advice h4{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.advice ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.tips{margin:0;padding-left:1.1em;display:grid;gap:4px}
.advice li{padding-left:2px}
.yes{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}
.src{color:var(--muted);font-size:.88rem}
.monfoot{display:flex;gap:8px;flex-wrap:wrap}
.addform{display:grid;grid-template-columns:1fr 80px auto;gap:8px}
.addform input{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.starters{display:flex;gap:8px;flex-wrap:wrap}
/* Battle */
.enemy{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.enemy:last-child{border-bottom:0}
.enemy .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pick{font-size:.95rem}
.weak{font-size:.88rem;color:var(--muted)}
.weakline{font-size:.92rem}.weakline .types{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}.cat{display:inline-block;min-width:1.4em;padding:0 4px;border-radius:5px;font-size:.75rem;font-weight:800;text-align:center;vertical-align:1px;border:1px solid currentColor}.cat-p{color:#c0562a}.cat-s{color:#3b6fd1}.cat-f{color:#6b7280}
.x4{font-size:.8rem;margin:0 2px 0 -2px}
.alert{border-left:4px solid var(--warn);padding:8px 12px;background:var(--hidden-bg);border-radius:6px;font-size:.95rem}
.ok{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:640px;width:100%}
.tabs button{flex:1;padding:12px 4px 14px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:.95rem;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:18px;text-align:left}
.nickrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.nickrow input{min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.vidbox{margin-top:16px}
.vidframe{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.vidframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidbtn{text-align:left;width:100%}
.maplinks{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:.95rem}
.maplinks a{color:var(--accent);font-weight:700;text-underline-offset:3px}
/* Play */
.bigbtn{min-height:52px;font-size:1.05rem;flex:1}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nexthead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nextmain{font-size:1.15rem;font-weight:700}
.nextmain .where{font-weight:400;font-size:1rem}
.nextcard{border-color:var(--accent)}
.checks .nextrow label{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.checks .locked .txt{opacity:.6}
.checks li.done label{padding:6px 12px}
.checks li.done .where,.checks li.done .tag{display:none}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px 46px}
.stepnote{margin:0 0 8px;color:var(--muted);font-size:.92rem}
.say{flex:0 0 52px;width:52px;height:52px}
.prompt .say{flex:0 0 40px;width:40px;height:40px;font-size:1.1rem}
.capbar{margin-top:0;height:10px}
.prow{display:grid;gap:8px;padding:10px 12px}
.prowhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prowhead .nm{min-width:0}
.lvl .plus1{width:64px;height:48px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prompt{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:8px}
.encs{display:flex;flex-wrap:wrap;gap:8px}
.encbtn{padding:10px 14px;min-height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.encbtn .tag{margin-left:2px}
.encpanel{border-color:var(--accent);margin-bottom:10px}
.encres{display:grid;gap:8px}
.encbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.encbtn.on .muted{color:inherit}
.encbtn:disabled{opacity:.45;cursor:default}
.fightcard{border-color:var(--accent)}
.fightbest{display:grid;gap:6px;background:var(--sunk);border-radius:10px;padding:10px}
.fightpick{font-size:1.05rem}
.fightlist{margin:6px 0 0;padding-left:1.1em;display:grid;gap:6px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.ctab{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.ctab th:first-child{text-align:left;font-weight:600}
.catchcard ol.tips{padding-left:1.3em;margin:0;display:grid;gap:6px}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';margin-left:auto;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold>summary h3{margin:0}
details.fold[open]>summary{margin-bottom:8px}
.alert.danger{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));margin:0}
.encl{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">LeafGreen Field Notes</div>
    <div class="save" id="save">Saved on this device</div>
  </header>
  <nav class="areabar" aria-label="Choose area">
    <div class="row">
      <button class="iconbtn" id="prev" aria-label="Previous area">‹</button>
      <select id="areaSel" aria-label="Current area"></select>
      <button class="iconbtn" id="next" aria-label="Next area">›</button>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="meta" id="meta"></div>

  <div id="vid"></div>
  <main id="main"></main>
</div>
<nav class="tabs" role="tablist"><div class="in">
  <button role="tab" id="tab-play" data-tab="play">Play</button>
  <button role="tab" id="tab-team" data-tab="team">Team</button>
  <button role="tab" id="tab-guide" data-tab="guide">Guide</button>
  <button role="tab" id="tab-dex" data-tab="dex">Pokédex</button>
</div></nav>

<script>
const D = /*__DATA__*/;
const TRAINERS = /*__TRAINERS__*/;
const ROUTE = /*__ROUTE__*/;
/*__WALK__*/
</script>
<script>
"use strict";
// ---------- lookups ----------
const TYPE_COL={Normal:'#9C9C7A',Fire:'#E8792E',Water:'#5684E6',Electric:'#E5BE1F',Grass:'#5CB33E',Ice:'#76CFCF',Fighting:'#BC3029',Poison:'#9A3F9A',Ground:'#D8B65A',Flying:'#9C88E6',Psychic:'#EC4E7E',Bug:'#A2B520',Rock:'#B49E3C',Ghost:'#6C5594',Dragon:'#6A3CEE',Dark:'#6C5648',Steel:'#B4B4CC','???':'#7A9A8A'};
const TYPES=D.types;
const SP=D.pokemon, MV=D.moves;
const nameToId={}; for(const id in SP) nameToId[SP[id].n.toLowerCase()]=+id;
const moveByName={}; for(const id in MV) moveByName[MV[id].n.toLowerCase()]=+id;
const tmLabelToMove={}; for(const mid in D.machines) tmLabelToMove[D.machines[mid]]=+mid;
const AREA_IDX={}; WALK.forEach((a,i)=>AREA_IDX[a.id]=i);
const BOSS_AREA={}; WALK.forEach((a,i)=>(a.bosses||[]).forEach(b=>BOSS_AREA[b]=i));
const BOSS_ORDER=[]; WALK.forEach(a=>(a.bosses||[]).forEach(b=>BOSS_ORDER.push(b)));
const HM_NAMES=new Set(['Cut','Fly','Surf','Strength','Flash','Rock Smash','Waterfall','Dive']);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eff=(atk,defs)=>defs.reduce((m,d)=>m*(d==='Levitate'?(atk==='Ground'?0:1):((D.chart[atk]&&D.chart[atk][d]!=null)?D.chart[atk][d]:1)),1);
const LEVITATE=new Set(['Gastly','Haunter','Gengar','Koffing','Weezing','Misdreavus','Unown','Vibrava','Flygon','Lunatone','Solrock','Baltoy','Claydol','Duskull','Chimecho','Latias','Latios']);
const defT=id=>LEVITATE.has(SP[id].n)?[...SP[id].t,'Levitate']:SP[id].t;
const typeChip=t=>`<span class="type" style="--t:${TYPE_COL[t]||'#888'}">${esc(t)}</span>`;
// Gen 3: physical or special goes by the move's type. P uses Attack, S uses Sp. Atk. Status moves get no tag.
// Fixed-damage moves (Seismic Toss = your level, Super Fang = half its HP...) ignore both stats: tag "Fixed".
const isFixed=m=>!!(m&&(FIXED[m.n]||m.n==='Super Fang'));
const catTag=mid=>{const m=MV[mid]; if(!m||m.c==='status') return '';
  if(isFixed(m)) return ` <span class="cat cat-f" title="Fixed damage: ignores Attack and Sp. Atk">Fixed</span>`; const p=m.c==='physical';
  return ` <span class="cat ${p?'cat-p':'cat-s'}" title="${p?'Physical: uses Attack':'Special: uses Sp. Atk'}">${p?'P':'S'}</span>`;};
// Which kind of attacker a species is, from its base Attack and Sp. Atk.
function attackerLine(sp){const s=SP[sp].s, d=s.atk-s.spa;
  return Math.abs(d)<15?`Mixed attacker: Attack ${s.atk}, Sp. Atk ${s.spa}. P and S moves both work.`
    :d>0?`Physical attacker: Attack ${s.atk}, Sp. Atk ${s.spa}. Best with P moves.`:`Special attacker: Sp. Atk ${s.spa}, Attack ${s.atk}. Best with S moves.`;}
const typeChips=ts=>`<span class="types">${ts.map(typeChip).join('')}</span>`;

// ---------- state ----------
const KEY='lgfn-v1';
let S={v:1,area:'mtmoon',starter:null,done:{},team:[],beaten:{},tab:'play',boss:null,itemFilter:'all',savedAt:0};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
let saveTimer=null, saving=false, pending=false;
// Saves go to this phone first, then to the homelab (api/state). Newest savedAt wins.
const SYNC=typeof location!=='undefined'&&/^https?:$/.test(location.protocol);
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!SYNC){setSave('Saved on this device');return}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote,700);
}
async function pushRemote(){
  if(saving){pending=true;return}
  saving=true; setSave('Saving…');
  try{
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
    if(r.status===409) adopt(await r.json(),'Updated from another device');
    else if(r.ok) setSave('Saved to homelab');
    else throw new Error(r.status);
  }catch(e){setSave('Offline. Saved on this device.');}
  saving=false; if(pending){pending=false;pushRemote();}
}
function adopt(r,msg){
  const tab=S.tab; if(!r.giftSync) delete S.giftSync; S=Object.assign(S,r); S.tab=tab;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render(); setSave(msg);
}
let appVer=null;   // page version seen on the first pull
async function pull(){
  if(saving) return;
  try{
    const res=await fetch('api/state',{cache:'no-store'}), v=res.headers.get('X-App-Version');
    // The server has a newer page (after a deploy): reload into it. The save is already in localStorage.
    if(v&&appVer&&v!==appVer&&!encSel&&!vidOn&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){location.reload();return;}
    appVer=appVer||v;
    const r=await res.json();
    if((r.savedAt||0)>(S.savedAt||0)) adopt(r,'Updated from homelab');
    else if((S.savedAt||0)>(r.savedAt||0)) pushRemote();   // offline changes, or first run
    else setSave('Saved to homelab');
  }catch(e){setSave('Offline. Saved on this device.');}
}
function setSave(t){document.getElementById('save').textContent=t}
if(SYNC){
  setTimeout(pull,0);
  // Stay in sync with another device or tab: check when the app comes back into view, and every 30s.
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') pull()});
  setInterval(()=>{if(document.visibilityState==='visible') pull()},30000);
}

// ---------- game logic ----------
const areaIdx=()=>AREA_IDX[S.area]??0;
function availableTMs(ai){
  const out={};
  for(let i=0;i<=ai;i++) for(const it of WALK[i].items){
    const m=/^(TM|HM)(\d\d)/.exec(it[0]); if(!m) continue;
    const lab=m[1]+m[2], mid=tmLabelToMove[lab]; if(mid==null) continue;
    const how=it[2]==='b'?'buy':it[2]==='s'?'coins':'find';
    if(how==='coins'&&!S.coinTMs) continue;   // 4,000 coins is about ₽80,000: only when the owner turns them on
    if(out[mid]&&(out[mid].how!=='find'||how==='find')) continue;
    const coins=how==='coins'?(/([\d,]+) coins/.exec(it[1])||[])[1]:null;
    out[mid]={label:lab,where:WALK[i].name,how,coins};
  }
  return out;
}
function availableTutors(ai){
  const out={};
  for(const [n,a] of TUTORS){ if(AREA_IDX[a]<=ai){const mid=moveByName[n.toLowerCase()]; if(mid) out[mid]={where:WALK[AREA_IDX[a]].name};}}
  return out;
}
const reminderOpen=ai=>ai>=AREA_IDX['sevii'];
function defaultMoves(sp,lv){

    for(const m in e){ if(!catchOpen(m,i)) continue;

        if(key<2) continue; const v=hms.length*10-Math.max(0,i-ai)*3-bst(finalForm(sp))/100;

}
function hmPlan(){

    const known=own.find(i=>S.team[i].moves.includes(mid));

    for(const i of pick){const m=S.team[i]; if((MV[mid].p||0)<70||canLearn(m,mid)!=='now') continue;
      const locked=m.moves.filter(id=>MV[id]&&HM_NAMES.has(MV[id].n)), now=setValue(m.moves,m,tg), r=bestSet([...m.moves,mid],m,tg,locked);

    for(const hm of got) Object.assign(out[hm],{i:mule,mule:true,known:mm.moves.includes(hmMid(hm)),later:!mm.moves.includes(hmMid(hm))&&canLearn(mm,hmMid(hm))==='later',inPick:false,with:got.filter(h=>h!==hm)});
    left=left.filter(hm=>!got.includes(hm));}

  while(left.length){
    const sc=i=>{const m=S.team[i]; let v=0; for(const hm of left){const c=canLearn(m,hmMid(hm)); if(m.moves.includes(hmMid(hm))) v+=2; else if(c==='now') v+=1; else if(c==='later') v+=.5;}
      return v?v-(pick.includes(i)?10:0)-(m.dc?1:0)+10:0;};   // +10 keeps it above 0: a best-team one only if nobody else can
    const i=own.filter(i=>sc(i)>0).sort((a,b)=>sc(b)-sc(a))[0]; if(i==null) break;
    const got=left.filter(hm=>canLearn(S.team[i],hmMid(hm))||S.team[i].moves.includes(hmMid(hm)));
    for(const hm of got) Object.assign(out[hm],{i,known:S.team[i].moves.includes(hmMid(hm)),later:canLearn(S.team[i],hmMid(hm))==='later',inPick:pick.includes(i),with:got.filter(h=>h!==hm)});

}

// Before the Elite Four: best-team Pokémon carrying weak HMs (Victory Road is the last place that needs them) should

    const hms=Object.keys(HM_INFO).filter(hm=>{const x=hp[hm], mid=hmMid(hm); if(hm==='Fly'||mid==null||!x) return false;
      if(x.kind==='strong'&&x.i===i) return false;   // a strong one stays

}

function renderHMs(a){
  const rows=[];
  for(const hm in HM_INFO){
    const inf=HM_INFO[hm], getHere=inf.get===a.id, needHere=inf.need.includes(a.id);

    if(getHere&&AREA_IDX[inf.get]<AREA_IDX.fuchsia&&(hmPlan()[hm]||{}).kind!=='strong') txt+=` <span class="src">HM moves can only be removed by the Move Deleter in Fuchsia City.</span>`;

function chainLvMoves(from,to,lv0,L){
  // Level-up moves it can still learn on the way from `from` (now, Lv lv0) to `to` (at Lv L). Baby forms don't count.
  const path=[from]; let id=from;
  for(let g=0;g<3&&id!==to;g++){const e=SP[id].ev.find(([t,h])=>SP[t]&&(/^Lv /.test(h)||FRLG_STONES.includes(h)||h==='High friendship')); if(!e) break; id=e[0]; path.push(id);}
  const out=new Set();
  for(const sid of path) for(const [l,m] of SP[sid].lv) if(l<=L&&(l>lv0||sid===from)) out.add(m);

function catchPicks(groups){
  const up=upcomingEnemies(3), E=up.enemies; if(!E.length) return [];
  const owned=new Set(S.team.filter(m=>!gone(m)).map(m=>familyRoot(m.sp)));
  const partyMons=partyIdx().map(i=>S.team[i]);
  const L=Math.max(partyLevel(),...E.map(e=>e.lv-3));
  const baseV=teamValue(partyMons,E);
  const seen=new Set(), out=[];
  const ai=areaIdx(), okM={walk:0,'old-rod':AREA_IDX.vermilion,'good-rod':AREA_IDX.fuchsia,'super-rod':AREA_IDX.route12,surf:AREA_IDX.fuchsia,'rock-smash':AREA_IDX.saffron};
  for(const [k,m,list] of groups) for(const [pid] of list){
    if(okM[m]==null||ai<okM[m]) continue;
    if(seen.has(pid)||!SP[pid]||owned.has(familyRoot(pid))) continue; seen.add(pid);
    const pr=projected(pid,L);
    let gain;
    if(partyMons.length<6) gain=teamValue([...partyMons,pr],E)-baseV;
    else{gain=-1e9; for(let x=0;x<partyMons.length;x++){const t=[...partyMons];t[x]=pr;gain=Math.max(gain,teamValue(t,E)-baseV);}}
    const fin=finalForm(pid), fb=bst(fin);
    const score=(baseV>0?gain/baseV*100:gain/2)+(fb-400)/10;
    if(score<=5) continue;
    // which upcoming battles it helps with
    const helps=[];
    for(const b of up.bosses){
      const es=E.filter(e=>e.boss===b);
      if(es.some(e=>{const v=matchScore(pr,e).sc; return v>0&&partyMons.every(pm=>matchScore(pm,e).sc<v);})) helps.push(BOSSES[b].name);
    }
    const bits=[];
    if(fin!==pid) bits.push(`Becomes ${SP[fin].n} (${evoHow(pid,fin)})`);
    if(helps.length) bits.push(`Best answer to parts of ${[...new Set(helps)].join(' and ')}`);
    if(fb>=500) bits.push('Very strong final stats');
    else if(!helps.length&&fin===pid) bits.push('Adds a type your team is missing');
    out.push({sp:pid,score,why:bits.join('. ')+'.'});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,3);
}

// Whole-battle plan: who takes each of their Pokémon, in order, sharing out PP and the damage each of yours takes.
// Safest first (no one-hit KO risk), then least damage taken, how worn down it already is, and fewest tries.
// Their Pokémon in order. Each gets your best answer; PP and damage taken add up over the battle.
// Set-up sweeps: a boost move first when it's safe and the turn pays off here and on the next ones it can stay in for.
// The boost lasts while the same one stays in (`up`); a switch loses it.
function planBattle(mons,ens){
  const used={}, worn=mons.map(()=>0), rows=[]; let up=null;
  ens.forEach((en,j)=>{ if(!en){rows.push(null); up=null; return;}
    const opts=[];
    mons.forEach((m0,k)=>{const m=up&&up.k===k?{...m0,bst:up.bst}:m0, pp=mid=>(MV[mid].pp||0)-(used[k+':'+mid]||0), yh=yourHit(m,en,pp); if(!yh) return;
      const th=threat(en,m), fs=faster(m,en), risk=!th?0:th.pMin>=100?3:th.pMax>=100?2:th.pCrit>=100?1:0;
      const taken=Math.max(0,yh.tries-(fs>0?1:fs<0?0:.5))*(th?th.pMax:0);
      opts.push({k,m,en,yh,th,fs,yours:yh.pMin>=100?1:yh.hits,acc:yh.acc,risk,taken,pp,boosted:m!==m0,sc:risk*1000+taken+worn[k]*.5+yh.tries*8+yh.uses/(MV[yh.mid].pp||1)*40});   // last term: don't burn a move with little PP
      if(m===m0&&risk===0){const su=setupOpt(m0,k,en,yh,ens.slice(j+1),pp,worn[k]); if(su) opts.push(su);}});
    opts.sort((a,b)=>a.sc-b.sc);
    const x=opts[0]||null;
    if(x){const key=x.k+':'+x.yh.mid; used[key]=(used[key]||0)+x.yh.uses; worn[x.k]+=x.taken; x.left=x.pp(x.yh.mid);
      if(x.setup){const sk=x.k+':'+x.setup; used[sk]=(used[sk]||0)+1;}
      up=x.setup?{k:x.k,bst:x.m.bst}:x.boosted?up:null;
      x.alt=opts.find(o=>o.k!==x.k&&o.risk===0&&o.sc<x.sc*1.6+40)||null;}
    else up=null;
    rows.push(x);
  });
  return {rows,used,worn};
}
// The boost move to use before attacking with `yh` (same kind of attack, PP left), as a planBattle option, or null.
function setupOpt(m,k,en,yh,next,pp,worn){
  const cat=MV[yh.mid].c, ghost=SP[m.sp].t.includes('Ghost');
  const b=m.moves.filter(id=>MV[id]&&BOOST[MV[id].n]&&boostCat(MV[id].n)===cat&&pp(id)>0&&!(ghost&&MV[id].n==='Curse'))
    .sort((x,y)=>(BOOST[MV[y].n][cat==='physical'?'atk':'spa'])-(BOOST[MV[x].n][cat==='physical'?'atk':'spa']))[0];
  if(b==null) return null;
  const mB={...m,bst:BOOST[MV[b].n]}, yb=yourHit(mB,en,pp); if(!yb) return null;
  const th=threat(en,mB), fs=faster(mB,en); if(th&&th.pCrit>=100) return null;
  const tries=1+yb.tries, taken=Math.max(0,tries-(fs>0?1:fs<0?0:.5))*(th?th.pMax:0);
  if(worn+taken>=90) return null;
  // What the boost saves on the next ones while it stays in: stop at the first it isn't safe against, or when it's worn out.
  let gain=0, hp=worn+taken, stay=0;
  for(const e of next){ if(!e) break; const t2=threat(e,mB); if(t2&&t2.pCrit>=100) break;
    const a=yourHit(m,e), c=yourHit(mB,e); if(!a||!c) break;
    const f2=faster(mB,e), tk=Math.max(0,c.tries-(f2>0?1:f2<0?0:.5))*(t2?t2.pMax:0); if(hp+tk>=90) break;
    hp+=tk; gain+=Math.max(0,a.tries-c.tries); stay++; }

function matchups(en,pp){

  const down=new Set(f.down||[]), left=info.ens.map((e,i)=>i).filter(i=>!down.has(i)&&info.ens[i]);

  if(info.dbl) h+=`<p class="note" style="margin:0">Double battle: two of theirs come out at once. Tap the one you want to hit.</p>`;
  h+=`<div class="encs">`+info.ens.map((e,i)=>e?`<button class="encbtn${i===f.cur?' on':''}" data-act="fcur" data-i="${i}" ${down.has(i)?'disabled':''}>${down.has(i)?'✗ ':''}${esc(SP[e.sp].n)} <span class="muted">${e.lv}</span></button>`:'').join('')+`</div>`;
  if(!left.length){
    h+=`<b>All of theirs fainted.</b>${foughtChips(f,info)}<button class="btn primary bigbtn" data-act="fwon">We won ✓</button>`;
  } else if(f.cur==null||down.has(f.cur)){
    h+=`<p style="margin:0">Tap the Pokémon they sent out.</p>`;
  } else {
    const ppl=(ix,mid)=>(MV[mid].pp||0)-((f.pp||{})[ix+':'+mid]||0), en=info.ens[f.cur], ms=matchups(en,ppl), best=ms[0];
    h+=`<div>${typeChips(SP[en.sp].t)} <span class="muted">Moves: ${en.moves.map(m=>esc(MV[m].n)).join(', ')}</span></div>${weakLine(en.sp)}`;
    if(!best) h+=`<p class="muted" style="margin:0">No party Pokémon to plan with.</p>`;
    else{
      h+=`<div class="fightbest"><span class="tag tm" style="margin:0">Best pick</span>${mLine(best,true)}</div>`;
      const warn=nuz()&&best.risk?dangerLine(best.m,en):'';
      if(warn) h+=`<div class="alert danger">${warn}${best.risk>1?' Everyone else is at risk too. Heal first, or use a Potion early.':''}</div>`;
      else h+=`<p class="alert ok" style="margin:0">${esc(best.m.nick||SP[best.m.sp].n)} is safe from one-hit knockouts here, even a critical hit.</p>`;
      // Set-up sweep for the rest of their team (this one first), from the whole-battle planner.
      const rest=[f.cur,...left.filter(i=>i>f.cur),...left.filter(i=>i<f.cur)], pi=partyIdx();
      const sw=(planBattle(pi.map(i=>S.team[i]),rest.map(i=>info.ens[i])).rows[0]);
      if(sw&&sw.setup){const sm=S.team[pi[sw.k]];
        h+=`<div class="alert ok" style="margin:0"><b>Sweep:</b> send <b>${esc(sm.nick||SP[sm.sp].n)}</b>, use <b>${esc(MV[sw.setup].n)}</b> once, then <b>${esc(MV[sw.yh.mid].n)}</b>.${sw.stay?` Keep it in: it's safe against the next ${sw.stay>1?sw.stay:'one'} too.`:''}</div>`;}
      const tips=stratTips(best,mid=>ppl(best.ix,mid));
      if(best.yh) tips.push(`PP: ${esc(MV[best.yh.mid].n)} about ${Math.max(0,best.yh.left)} of ${MV[best.yh.mid].pp} left.`);
      if(tips.length) h+=`<ul class="tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ul>`;
      if(ms.length>1) h+=`<details><summary>Others in your party</summary><ul class="fightlist">${ms.slice(1).map(x=>mLine(x)).join('')}</ul></details>`;
      const say=`Send ${best.m.nick||SP[best.m.sp].n}. `+(best.yh&&best.yh.pMax>0?`Use ${MV[best.yh.mid].n}.`:'');
      h+=`<div class="row2"><button class="btn primary bigbtn" data-act="fdown">It fainted ✓</button>${sayBtn(say)}</div>`;
    }
    h+=`<p class="note" style="margin:0">Damage assumes no stat changes. PP left is a guess from the plan, starting full.</p>`;
  }
  h+=`<div class="row2"><button class="btn small ghost" data-act="fstop">Close</button>${left.length?`<button class="btn small ghost" data-act="fwon">We won</button>`:''}</div></div></section>`;
  return h;
}
// Who fought a trainer battle (they get the EXP). Default: the best pick against each of their Pokémon.
function fightDefault(f){const info=fightInfo(f); return info?[...new Set(info.ens.filter(Boolean).map(en=>(matchups(en)[0]||{}).ix).filter(x=>x!=null))]:[];}
function fightGains(f,info){const fo=f.fought||fightDefault(f), out={};
  for(const en of info.ens.filter(Boolean)){const g=expGain(en.sp,en.lv,true,fo); for(const i in g) out[i]=(out[i]||0)+g[i];} return out;}
function foughtChips(f,info){
  if(!partyIdx().length) return ''; const fo=f.fought||fightDefault(f), g=fightGains(f,info);
  return `<div class="row2"><span class="muted">Who fought? They get the EXP:</span>${partyIdx().map(i=>`<button class="btn small${fo.includes(i)?' primary':''}" data-act="ffought" data-ix="${i}" aria-pressed="${fo.includes(i)}">${esc(S.team[i].nick||SP[S.team[i].sp].n)}${g[i]?` +${fmtN(g[i])}`:''}</button>`).join('')}</div>`;
}

function renderRematches(a){
  const rms=rematchable(a); if(!rms.length) return '';

}

};
const NICK_SUFFIX=['ster','zilla','ito','bert','ington','y','o','kins','ers','ella'];
function nickIdeas(sp){
  const p=SP[sp], name=p.n.replace(/[♀♂.'’\s-]/g,'');
  const out=[];
  for(const t of p.t) out.push(...(NICK_TYPE[t]||[]));
  const base=name.replace(/^Mr/,''), stem=base.slice(0,Math.min(5,Math.max(3,Math.ceil(base.length/2))));
  for(const s of NICK_SUFFIX) out.push(stem.replace(/[aeiouy]$/i,'')+s);
  if(!/^mr/i.test(name)) for(const pre of ['Lil ','Big ']) if((pre+name).length<=10) out.push(pre+name);
  return [...new Set(out.map(x=>x[0].toUpperCase()+x.slice(1)).filter(x=>x.length<=10&&x.toLowerCase()!==p.n.toLowerCase()))];
}
function suggestNick(sp,avoid){
  const used=new Set(S.team.map(m=>m.nick).filter(Boolean)); if(avoid) used.add(avoid);
  const ideas=nickIdeas(sp).filter(n=>!used.has(n));
  const pool=ideas.length?ideas:nickIdeas(sp);
  return pool[Math.floor(Math.random()*pool.length)];
}
// Indexes after a removed Pokémon move down one: keep the Exp. Share holder pointing at the same one.
function removeMon(ix){const sh=S.share!=null?S.team[S.share]:null, mu=S.mule!=null?S.team[S.mule]:null; S.team.splice(ix,1); if(sh){const j=S.team.indexOf(sh); S.share=j<0?null:j;}
  if(mu){const j=S.team.indexOf(mu); if(j<0) delete S.mule; else S.mule=j;} justCaught=justTraded=null; tradeSel={};}
function addMon(sp,lv){
  lv=Math.max(1,Math.min(100,lv|0||5));
  const box=partyIdx().length>=6;
  S.team.push({sp,lv,moves:defaultMoves(sp,lv),box,nick:suggestNick(sp)}); return box?'pc':'party';
}

  if(act==='lv'){const m=S.team[ix], d=+t.dataset.d; m.xp=d>0?Math.max(0,(m.xp||0)-levelExp(m)):0; m.lv=Math.max(1,Math.min(100,m.lv+d)); save(); render(); return}
  if(act==='evolve'){S.team[ix].sp=+t.dataset.to; save(); render(); return}
  if(act==='resetmoves'){const m=S.team[ix]; m.moves=defaultMoves(m.sp,m.lv); save(); render(); return}
  if(act==='up'){const p=partyIdx(), k=p.indexOf(ix); if(k>0){const a=S.team,j=p[k-1]; [a[j],a[ix]]=[a[ix],a[j]];} save(); render(); return}
  if(act==='faint'){
    if(t.dataset.confirm!=='1'){t.dataset.confirm='1'; t.textContent='Tap again: fainted for good'; return}
    S.team[ix].dead=true; S.team[ix].died={a:S.area,t:Date.now()}; S.open=null; save(); render(); return}
  if(act==='revive'){S.team[ix].dead=false; delete S.team[ix].died; S.team[ix].box=partyIdx().length>=6; save(); render(); return}
  if(act==='remove'){
    if(t.dataset.confirm!=='1'){t.dataset.confirm='1'; t.textContent='Tap again to remove'; return}
    removeMon(ix); S.open=null; save(); render(); return}
});
mainEl.addEventListener('change',e=>{
  const t=e.target; const act=t.dataset.act; if(!act) return; const ix=+t.dataset.ix;
  if(act==='check'){S.done[t.dataset.key]=t.checked; if(!t.checked) delete S.done[t.dataset.key]; tickGifts(t.dataset.key,t.checked); save(); render(); return}
  if(act==='nick'){S.team[ix].nick=t.value.trim().slice(0,10); save(); render(); return}
  if(act==='lvset'){const m=S.team[ix]; m.lv=Math.max(1,Math.min(100,+t.value||m.lv)); save(); render(); return}
  if(act==='move'){const m=S.team[ix]; const v=t.value?+t.value:null; const arr=[...m.moves]; arr[+t.dataset.slot]=v; m.moves=[...new Set(arr.filter(x=>x!=null))]; save(); render(); return}
  if(act==='dex'){S.dex=S.dex||{}; if(t.checked) S.dex[t.dataset.id]=true; else delete S.dex[t.dataset.id]; save(); render(); return}
  if(act==='nuz'){S.nuz=t.checked; save(); render(); return}
  if(act==='coins'){S.coinTMs=t.checked; _proj.clear(); save(); render(); return}
  if(act==='bosssel'){S.boss=t.value; save(); render(); return}
  if(act==='cardgot'){const k=S.cards&&S.cards[ix]; if(!k) return; k.got=t.checked; save(); render(); return}
  if(act==='cardkind'){if(cardUI) cardUI.kind=t.checked?'retro':'modern'; render(); return}
  if(act==='beaten'){if(t.checked) S.beaten[t.dataset.boss]=true; else delete S.beaten[t.dataset.boss]; save(); render(); return}
});
mainEl.addEventListener('submit',e=>{
  e.preventDefault();
  const enc=e.target.dataset.act==='encform', inp=document.getElementById(enc?'encName':'addName');
  const name=inp.value.trim().toLowerCase();
  let id=nameToId[name];
  if(!id){const hit=Object.keys(nameToId).find(n=>n.startsWith(name)); if(hit&&name) id=nameToId[hit];}
  if(!id){inp.setCustomValidity('No Pokémon with that name. Pick one from the list.'); inp.reportValidity(); inp.setCustomValidity(''); return}
  if(enc){encSel={sp:id,lv:5}; justCaught=null; render(); return}
  addMon(id,+document.getElementById('addLv').value); save(); render();
});
render();
</script>
