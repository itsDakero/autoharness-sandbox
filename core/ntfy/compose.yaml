services:
  ntfy:
    image: binwiederhier/ntfy:v2.30.0
    container_name: ntfy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: ${PUID}:${PGID}
    command: serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: http://homelab:8081   # must match the server URL typed in the iOS app (push = sha256 of URL/topic)
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_BEHIND_PROXY: "true"
      # Lets the iOS app get instant push for this self-hosted server
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    ports:
      - "8081:80"                    # host port = homelab.port
    volumes:
      - ${APPDATA_PATH}/ntfy:/var/lib/ntfy
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN}`)
      - traefik.http.routers.ntfy.entrypoints=web
      - traefik.http.services.ntfy.loadbalancer.server.port=80
      # Dashboard
      - homelab.name=ntfy
      - homelab.group=Infrastructure
      - homelab.icon=ntfy
      - homelab.audience=admin
      - homelab.description=Push notifications
      - homelab.port=8081
      # Uptime Kuma (AutoKuma)
      - kuma.ntfy.http.name=ntfy
      - kuma.ntfy.http.url=http://${LAN_IP}:8081/v1/health

networks:
  proxy:
    external: true
