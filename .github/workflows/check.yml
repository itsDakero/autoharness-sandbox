name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install shellcheck and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
      - name: Run scripts/check.sh
        run: scripts/check.sh
