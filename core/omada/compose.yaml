services:
  omada:
    image: mbentley/omada-controller:6.2.14.11
    container_name: omada
    restart: unless-stopped
    # Host network: APs discover/adopt over L2. Ports go through UFW (see docs).
    # No Traefik: host mode is off the proxy network; UI is HTTPS-only (8043).
    network_mode: host
    stop_grace_period: 60s          # MongoDB needs time to shut down cleanly
    ulimits:
      nofile: {soft: 4096, hard: 8192}
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
    volumes:
      - ${APPDATA_PATH}/omada/data:/opt/tplink/EAPController/data
      - ${APPDATA_PATH}/omada/logs:/opt/tplink/EAPController/logs
    labels:
      # Dashboard (8088 redirects to https://<host>:8043)
      - homelab.name=Omada
      - homelab.group=Infrastructure
      - homelab.icon=omada
      - homelab.audience=admin
      - homelab.description=TP-Link Omada controller for the 3 access points
      - homelab.port=8088
      # Uptime Kuma (AutoKuma) - UI is HTTPS with a self-signed cert
      - kuma.omada.http.name=omada
      - kuma.omada.http.url=https://${LAN_IP}:8043/
      - kuma.omada.http.ignore_tls=true
