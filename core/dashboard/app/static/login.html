<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- No referrer meta here: no-referrer makes the form post send "Origin: null", which the login rejects -->
<meta name="robots" content="noindex">
<title>Homelab admin login</title>
<!-- Served by app/main.py login_page(), which fills in the message and username placeholders (HTML-escaped) -->
<style>
  :root { --bg: #0a0d13; --card: #111620; --text: #e6e9ef; --muted: #8b94a7; --border: #1e2533; --down: #f87171;
          --accent: #5b8cff; --accent2: #22d3ee; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px; min-height: 100vh;
    background:
      radial-gradient(ellipse 60% 40% at 0% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent),
      radial-gradient(ellipse 60% 40% at 100% 0%, color-mix(in srgb, var(--accent2) 6%, transparent), transparent),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 380px; margin: 12vh auto 0; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  form {
    display: grid; gap: 14px; padding: 20px; border-radius: 16px; border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0)), var(--card);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
  input {
    width: 100%; font: inherit; font-size: 16px; /* 16px: no iOS zoom on focus */
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .error { margin: 0; color: var(--down); font-size: .9rem; }
  footer { margin-top: 16px; font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Homelab admin</h1>
  <form method="post" action="/login">
    <!--MSG-->
    <label>Username
      <input name="username" value="__USERNAME__" autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <footer><a href="/">Family view</a></footer>
</main>
</body>
</html>
