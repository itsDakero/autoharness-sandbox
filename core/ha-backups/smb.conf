# Samba config for core/ha-backups, mounted read-only over the image's default.
# SMB3 only, no guest, one user (hass, created by the image from USER/PASS), one share.
# If HA can't mount the share, see docs/m4-backups.md (stage C) for the "server signing = auto" fallback.
[global]
  server string = homelab
  security = user
  server min protocol = SMB3
  server signing = mandatory
  map to guest = never
  restrict anonymous = 2
  # The Pi only. 127.0.0.1 is the container itself (for smbclient tests), not reachable from outside.
  hosts allow = 192.168.0.78 127.0.0.1
  hosts deny = ALL
  disable netbios = yes
  smb ports = 445
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  follow symlinks = no
  wide links = no
  unix extensions = no

[ha-backups]
  path = /shared
  valid users = hass
  write list = hass
  guest ok = no
  browseable = no
  read only = no
  create mask = 0640
  directory mask = 0750
