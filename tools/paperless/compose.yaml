# Paperless-ngx: scanned documents with OCR and full-text search. Redis is its task broker and only
# talks to it on the project's own network. Users and documents live in its UI/database.
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.17.1
    container_name: paperless
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/accounts/login/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      paperless-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PAPERLESS_TIME_ZONE: ${TZ}
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set in .env}
      PAPERLESS_OCR_LANGUAGE: eng
      # every way Dan reaches it; PAPERLESS_URL would lock ALLOWED_HOSTS to one of them
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://${LAN_IP}:8095,http://homelab:8095,http://${TAILSCALE_IP}:8095,http://paperless.${DOMAIN}
    ports:
      - "8095:8000"
    volumes:
      - ${APPDATA_PATH}/paperless/data:/usr/src/paperless/data
      - ${APPDATA_PATH}/paperless/media:/usr/src/paperless/media
      - ${APPDATA_PATH}/paperless/consume:/usr/src/paperless/consume
      - ${APPDATA_PATH}/paperless/export:/usr/src/paperless/export
    networks:
      - proxy
      - paperless
    labels:
      # Traefik (bonus http://paperless.lan)
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)
      - traefik.http.routers.paperless.entrypoints=web
      - traefik.http.services.paperless.loadbalancer.server.port=8000
      # Dashboard
      - homelab.name=Paperless
      - homelab.group=Tools
      - homelab.icon=paperless-ngx
      - homelab.audience=admin
      - homelab.description=Scanned documents with OCR and search
      - homelab.port=8095
      # Uptime Kuma (AutoKuma)
      - kuma.paperless.http.name=paperless
      - kuma.paperless.http.url=http://${LAN_IP}:8095/accounts/login/

  paperless-redis:
    image: redis:7.4.5-alpine
    container_name: paperless-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${APPDATA_PATH}/paperless/redis:/data
    networks:
      - paperless

networks:
  proxy:
    external: true
  paperless:
