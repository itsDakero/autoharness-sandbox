{% extends "base.html" %}
{% block content %}
<h1>Finished: {{ b.title }}</h1>
<form method="post" action="/book/{{ b.id }}/finish">
  <p>Rating</p>
  <div class="stars">
    {% for n in range(1, 6) %}<label><input type="radio" name="rating" value="{{ n }}" {{ 'checked' if b.rating == n }}> {{ n }} &#9733;</label>{% endfor %}
  </div>
  <label>Date finished<input type="date" name="date" value="{{ today }}"></label>
  <button type="submit">Save</button>
  <a class="btn alt" href="/">Cancel</a>
</form>
{% endblock %}
